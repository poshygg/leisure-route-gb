[project]
name = "leisure-route"
version = "0.1.0"
description = "여유로운 보행 경로 추천 — 축 기반(A/B/Z) 엣지 스코어링 경로 탐색"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "python-igraph>=0.11",
    "osmnx>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "folium>=0.17"]
db  = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # pip install -e . 없이도 clone 직후 pytest가 돌게
